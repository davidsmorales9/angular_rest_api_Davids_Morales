<div class="dashboard-container">
  <h1 class="dashboard-title">Bienvenido</h1>
  
  <div class="cards-grid">
    @for (universe of universes; track universe.name) {
      <mat-card class="universe-card">
        <img mat-card-image [src]="universe.image" [alt]="universe.name">
        <mat-card-header>
          <mat-card-title>{{ universe.name }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{ universe.description }}</p>
        </mat-card-content>
        <mat-card-actions>

        
          <button mat-button color="primary" (click)="navigateTo(universe.route)">Ver Personajes</button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</div>
